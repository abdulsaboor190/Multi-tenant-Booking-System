services:
  db:
    image: postgres:17
    container_name: bookwise-db
    environment:
      POSTGRES_USER: bookwise
      POSTGRES_PASSWORD: bookwise_dev
      POSTGRES_DB: bookwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: bookwise-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

volumes:
  pgdata:
